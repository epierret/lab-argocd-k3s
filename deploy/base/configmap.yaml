apiVersion: v1
kind: ConfigMap
metadata:
  name: astro-page
data:
  index.html: |
    <!doctype html>
    <html lang="fr">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width,initial-scale=1">
      <title>Ciel profond</title>
      <style>
        html, body { margin:0; height:100%; overflow:hidden; color:#e8e8f0;
          font-family: system-ui, sans-serif;
          background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%); }
        .stars { position:fixed; inset:0;
          background-image:
            radial-gradient(1px 1px at 20% 30%, #fff, transparent),
            radial-gradient(1px 1px at 70% 60%, #fff, transparent),
            radial-gradient(2px 2px at 40% 80%, #ddd, transparent),
            radial-gradient(1px 1px at 85% 15%, #fff, transparent); }
        .planet { position:absolute; top:40%; left:50%; width:220px; height:220px;
          transform:translate(-50%,-50%); border-radius:50%;
          background: radial-gradient(circle at 35% 35%, #f4c27a, #c0703a 55%, #5a2d12);
          box-shadow: 0 0 80px rgba(244,194,122,.35); }
        .txt { position:absolute; bottom:8vh; width:100%; text-align:center; }
      </style>
    </head>
    <body>
      <div class="stars"></div>
      <div class="planet"></div>
      <div class="txt"><h1>Ciel profond</h1><p>Servi par nginx depuis une ConfigMap Kubernetes</p></div>
    </body>
    </html>
