apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: test-argo
  name: test-argo
  namespace: argocd
spec:
  replicas: 5
  selector:
    matchLabels:
      app: test-argo
  strategy: {}
  template:
    metadata:
      labels:
        app: test-argo
    spec:
      containers:
      - image: nginx
        name: nginx
        volumeMounts:
          - name: astro-volume
            mountPath: /usr/share/nginx/html
            readOnly: true
      volumes:
       - name: astro-volume
         configMap:
           name: astro-page        
