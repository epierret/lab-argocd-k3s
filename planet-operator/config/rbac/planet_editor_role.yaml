# This rule is not used by the project planet-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the space.lab.example.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: planet-operator
    app.kubernetes.io/managed-by: kustomize
  name: planet-editor-role
rules:
- apiGroups:
  - space.lab.example.com
  resources:
  - planets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - space.lab.example.com
  resources:
  - planets/status
  verbs:
  - get
