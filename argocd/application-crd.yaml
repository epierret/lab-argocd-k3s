apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lab-argocd-crds
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/epierret/lab-argocd-k3s.git
    targetRevision: main
    path: crds
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
